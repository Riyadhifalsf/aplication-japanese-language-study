name: japanese_study
description: Aplikasi belajar bahasa Jepang dan kanji N5-N1 untuk Android dan web.
publish_to: "none"
version: 3.1.0+41

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  google_sign_in: ^6.2.2
  http: ^1.4.0
  image_picker: ^1.1.2
  path_drawing: ^1.0.1
  shared_preferences: ^2.5.3
  crypto: ^3.0.7
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  home_widget: ^0.9.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/branding/
