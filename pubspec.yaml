name: japanese_study
description: Aplikasi belajar bahasa Jepang dan kanji N5-N1 untuk Android dan web.
publish_to: "none"
version: 3.3.0+46

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^6.2.2
  http: ^1.4.0
  flutter_secure_storage: ^9.2.4
  firebase_core: ^3.15.2
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.12
  image_picker: ^1.1.2
  path_drawing: ^1.0.1
  shared_preferences: ^2.5.3
  crypto: ^3.0.7
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  url_launcher: ^6.3.2
  google_mobile_ads: ^9.1.0
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/branding/
