services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: japanese_study
      POSTGRES_USER: japanese_study
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U japanese_study -d japanese_study"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://japanese_study:${POSTGRES_PASSWORD}@db:5432/japanese_study
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 30d
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      CORS_ORIGIN: "*"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  proxy:
    build: ./proxy
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    environment:
      DOMAIN: ${TLS_IP:-192.168.100.11}
    volumes:
      - nginx_certs:/etc/nginx/certs
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  nginx_certs:
