name: flutter-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair_compile:
    name: Repair Flutter source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic source repair
        run: python3 tool/repair_flutter_compile.py
      - name: Commit source repair
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-shot-flutter-repair.yml .repair-trigger 2>/dev/null || true
          git add lib/state/app_controller.dart \
                  lib/screens/home/home_screen.dart \
                  lib/screens/curriculum/curriculum_path_screen.dart \
                  lib/screens/curriculum/curriculum_lesson_detail_screen.dart
          if git diff --cached --quiet; then
            echo "No source repair changes needed."
            exit 0
          fi
          git commit -m "fix: repair flutter compile errors"
          git push origin main

  analyze:
    name: Analyze & Test
    needs: repair_compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh repaired main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install production dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Syntax check
        run: node --check src/server.js
      - name: Validate migration source syntax
        run: node --check src/migrate.js
