name: release-android

on:
  # Rilis kurasi manual (APK/AAB signed lokal diunggah via `gh release`).
  # Otomatisasi tag dimatikan agar tidak duplikat dengan rilis kurasi.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storeFile=app/upload-keystore.jks"
              echo "storePassword=$STORE_PASS"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASS"
            } > android/key.properties
          fi
          # google-services Gradle plugin butuh file ini saat build.
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        env:
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
        run: flutter build apk --release --dart-define=FIREBASE_ANDROID_API_KEY=$FIREBASE_ANDROID_API_KEY

      - name: Build App Bundle
        env:
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
        run: flutter build appbundle --release --dart-define=FIREBASE_ANDROID_API_KEY=$FIREBASE_ANDROID_API_KEY

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab